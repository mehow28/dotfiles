# GENERAL
general {
    disable_loading_bar = false
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = true
}

# BACKGROUND - Blur z ekranu
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# INPUT FIELD - Pole na hasło
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(33ccffee)
    inner_color = rgba(26, 27, 38, 0.8)
    font_color = rgb(224, 222, 244)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="##e0def4">Wpisz hasło...</span>
    hide_input = false
    rounding = 10
    check_color = rgba(235, 111, 146, 0.8)
    fail_color = rgba(49, 116, 143, 0.8)
    fail_text = <span foreground="##31748f"><b>$FAIL ($ATTEMPTS)</b></span>
    capslock_color = rgba(156, 207, 216, 0.8)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false

    position = 0, -120
    halign = center
    valign = center
}

# ZEGAR - Godzina
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(224, 222, 244, 1.0)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 200
    halign = center
    valign = center
}

# DATA
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(224, 222, 244, 0.8)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =    $USER
    color = rgba(224, 222, 244, 0.8)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -200
    halign = center
    valign = center
}

# UPTIME
label {
    monitor =
    text = cmd[update:60000] echo " $(uptime -p | sed 's/up //')"
    color = rgba(224, 222, 244, 0.6)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -280
    halign = center
    valign = center
}

# BATTERY (dla laptopów - nie będzie się pokazywać jak nie ma baterii)
label {
    monitor =
    text = cmd[update:10000] ~/.config/hypr/scripts/battery.sh
    color = rgba(224, 222, 244, 0.6)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -310
    halign = center
    valign = center
}
