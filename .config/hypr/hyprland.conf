# █▀▄▀█ █▀█ █▄░█ █ ▀█▀ █▀█ █▀█ █▀
# █░▀░█ █▄█ █░▀█ █ ░█░ █▄█ █▀▄ ▄█

# Monitor setup - Twoje 2 monitory
monitor=DP-3,1920x1080@240,0x0,1         # Lewy monitor (główny) - niżej
monitor=HDMI-A-1,1920x1080@75,1920x-100,1   # Prawy monitor - 10cm wyżej (190px)

# Wirtualny monitor dla Sunshine/Moonlight (tworzony przez exec-once)
# Sunshine użyje go gdy fizyczne monitory są wyłączone
monitor=HEADLESS-2,1920x1080@60,3840x0,1  # Wirtualny wyświetlacz - na prawo od HDMI

monitor=,preferred,auto,1                 # Fallback dla innych monitorów

# Default workspace per monitor
workspace=1,monitor:DP-3,default:true
workspace=2,monitor:DP-3
workspace=3,monitor:DP-3
workspace=4,monitor:DP-3
workspace=5,monitor:DP-3
workspace=6,monitor:HDMI-A-1,default:true
workspace=7,monitor:HDMI-A-1
workspace=8,monitor:HDMI-A-1
workspace=9,monitor:HDMI-A-1
workspace=10,monitor:HDMI-A-1

# █▀▀ ▀▄▀ █▀▀ █▀▀
# ██▄ █░█ ██▄ █▄▄

# Autostart - programy uruchamiane przy starcie
exec-once = ags run                                              # AGS widgets
exec-once = waybar                                              # Panel
# exec-once = hyprwave                                          # Music control overlay - DISABLED by user
exec-once = swaync                                               # Notyfikacje
exec-once = swayosd-server
exec-once = ~/.config/hypr/scripts/audio-restore-state.sh     # Przywróć stan audio (urządzenie + max 40% volume)
exec-once = nm-applet --indicator                              # WiFi applet
exec-once = blueman-applet                                     # Bluetooth applet
exec-once = /usr/lib/polkit-kde-authentication-agent-1         # Polkit agent (sudo GUI)
exec-once = wl-paste --type text --watch cliphist store        # Clipboard history (text)
exec-once = wl-paste --type image --watch cliphist store       # Clipboard history (images)
exec-once = awww-daemon  # Lekka alternatywa dla animated wallpapers
exec-once = sleep 2 && awww img /home/boni/Videos/walpaypa-fix4.webp --transition-type none  
exec-once = hypridle                                           # Idle manager & auto-lock
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP


# █▀▀ █▄░█ █░█
# ██▄ █░▀█ ▀▄▀

# GPU Configuration - Wymuś użycie RX 6700 XT (card1)
# Wyłącza iGPU Raphael (card0) który powodował crashe w Aquamarine
env = WLR_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0
env = AQ_DRM_DEVICES,/dev/dri/card1

# Opcjonalne - fallback dla starszych aplikacji
# WYŁĄCZONE - masz tylko jedną GPU (card0), DRI_PRIME=1 powodował crashe
# env = DRI_PRIME,1
env = DRI_PRIME,0

# Wayland/X11 environment
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,phinger-cursors-dark
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = QT_WAYLAND_FORCE_DPI,96
env = MOZ_ENABLE_WAYLAND,1

# XDG - dodaj ~/.local/share do ścieżki wyszukiwania desktop files
env = XDG_DATA_DIRS,/home/boni/.local/share:/home/boni/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share


# █ █▄░█ █▀█ █░█ ▀█▀
# █ █░▀█ █▀▀ █▄█ ░█░

input {
    numlock_by_default = true  # Numlock włączony przy starcie
    kb_layout = pl
    kb_variant =
    kb_model =
    kb_options = 
    kb_rules =

    follow_mouse = 0  # Wyłączone - focus tylko przez kliknięcie
    float_switch_override_focus = 2

    touchpad {
        natural_scroll = false
    }

    sensitivity = -0.4
    accel_profile = flat
}


# █▀▀ █▀▀ █▄░█ █▀▀ █▀█ ▄▀█ █░░
# █▄█ ██▄ █░▀█ ██▄ █▀▄ █▀█ █▄▄

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(a855f799) rgba(3b82f699) 45deg
    col.inactive_border = rgba(2d1b4e66)

    layout = dwindle
    allow_tearing = false  # Tearing WYŁĄCZONY - user nie chce tearingu
}


# █▀▄ █▀▀ █▀▀ █▀█ █▀█ ▄▀█ ▀█▀ █ █▀█ █▄░█
# █▄▀ ██▄ █▄▄ █▄█ █▀▄ █▀█ ░█░ █ █▄█ █░▀█

decoration {
    rounding = 0

    blur {
        enabled = false  # WYŁĄCZONE dla oszczędności GPU (było true)
        size = 6
        passes = 1  # Zmniejszone z 3 na 1 dla lepszej wydajności GPU
        xray = true
        ignore_opacity = false
        popups = true
        special = false  # Wyłącz blur dla special workspaces
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1a1a1aee)
    }
}


# ▄▀█ █▄░█ █ █▀▄▀█ ▄▀█ ▀█▀ █ █▀█ █▄░█ █▀
# █▀█ █░▀█ █ █░▀░█ █▀█ ░█░ █ █▄█ █░▀█ ▄█

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = slow, 0, 0.85, 0.3, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = bounce, 1, 1.6, 0.1, 0.85
    bezier = sligshot, 1, -1, 0.15, 1.25
    bezier = nice, 0, 6.9, 0.5, -4.20

    animation = windows, 1, 2.5, wind, slide
    animation = windowsIn, 1, 2.5, winIn, slide
    animation = windowsOut, 1, 2.5, winOut, slide
    animation = windowsMove, 1, 2.5, wind, slide
    animation = border, 1, 0.1, linear  # Instant border (10ms max)
    animation = borderangle, 1, 0.1, linear, loop
    animation = fade, 1, 0.2, overshot
    animation = workspaces, 1, 0.2, wind
    animation = specialWorkspace, 1, 0.2, overshot, slidevert
}


# █░░ ▄▀█ █▄█ █▀█ █░█ ▀█▀ █▀
# █▄▄ █▀█ ░█░ █▄█ █▄█ ░█░ ▄█

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
    # no_gaps_when_only - USUNIĘTE: opcja nie istnieje w 0.53.3
    # smart_split - USUNIĘTE: opcja nie istnieje w 0.53.3
    # smart_resizing - USUNIĘTE: opcja nie istnieje w 0.53.3
}

master {
    new_status = master
}


# █▀▄▀█ █ █▀ █▀▀
# █░▀░█ █ ▄█ █▄▄

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    
    # GPU optimizations - oszczędność zasobów
    vrr = 1  # WYŁĄCZONE - VRR powodował race condition w Mesa 25.3.5
    vfr = true  # Variable Frame Rate - renderuje tylko gdy są zmiany (oszczędza GPU!)
    
    # Dodatkowe optymalizacje
    animate_manual_resizes = false  # Wyłącz animacje przy ręcznym resize (mniej GPU)
    animate_mouse_windowdragging = false  # Wyłącz animacje przy przeciąganiu (mniej GPU)
    disable_autoreload = true  # false = normalne działanie (auto reload przy zmianie config)
    
    # Performance tweaks
    focus_on_activate = false  # Focus okna gdy się aktywuje
    # new_window_takes_over_fullscreen - USUNIĘTE: opcja nie istnieje w 0.53.3
    # initial_workspace_tracking - USUNIĘTE: opcja nie istnieje w 0.53.3
}


# █▀█ █▀▀ █▄░█ █▀▄ █▀▀ █▀█ - Rendering optimizations
# █▀▄ ██▄ █░▀█ █▄▀ ██▄ █▀▄

# render - SEKCJA NIE ISTNIEJE W HYPRLAND 0.53.3!
# Explicit sync jest teraz w różnych miejscach:
# - OpenGL ma własne ustawienia
# - Direct scanout jest w misc

opengl {
    nvidia_anti_flicker = false  # Wyłączone (masz AMD GPU - RX 6700 XT)
    # force_introspection - USUNIĘTE: opcja nie istnieje w 0.53.3
}

cursor {
    no_hardware_cursors = false  # false = używaj hardware cursor (mniej obciąża GPU)
    no_break_fs_vrr = true  # WYŁĄCZONE VRR w fullscreen - stabilność
    min_refresh_rate = 60  # Minimalny refresh rate (oszczędza GPU gdy idle)
    hotspot_padding = 0  # Bez paddingu = mniej GPU work
    inactive_timeout = 0  # 0 = cursor zawsze aktywny (bez ukrywania)
    no_warps = false  # false = pozwól na warping (lepsze dla multi-monitor)
    persistent_warps = false  # false = nie zapamiętuj warp positions
    warp_on_change_workspace = false  # false = nie warp przy zmianie workspace
}


# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀█ █░█ █░░ █▀▀ █▀
# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█

# Float rules dla różnych okien (commented out temporarily to fix errors)
# windowrule = float, pavucontrol
# windowrule = float, nm-connection-editor
# windowrule = float, blueman-manager
# windowrule = float, polkit-kde-authentication-agent-1

# Opacity rules - Qt apps don't support opacity well through Hyprland
# Using compositor settings instead

# Spotify fix (commented out temporarily to fix errors)
# windowrule = tile, Spotify
# windowrule = workspace 5, Spotify

# VirtualBox - ukryj pomocnicze czarne okienko
; window = float, class:(VirtualBoxVM), title:(VirtualBoxVM)
; window = size:0 0, class:(VirtualBoxVM), title:(VirtualBoxVM)
; window = move:100%-0 100%-0, class:(VirtualBoxVM), title:(VirtualBoxVM)
; window = nofocus, class:(VirtualBoxVM), title:(VirtualBoxVM)
; window = nofocus, class:(VirtualBox Machine), title:(win11.*Starting)
; window = nofocus, initialTitle:(win11.*Starting)

# Oszczędność GPU - wyłącz blur dla fullscreen i maxed okien
; window = noblur, fullscreen:1
; window = noblur, class:(firefox), fullscreen:1
; window = noblur, class:(Spotify)


# █▄▀ █▀▀ █▄█ █▄▄ █ █▄░█ █▀▄ █▀
# █░█ ██▄ ░█░ █▄█ █ █░▀█ █▄▀ ▄█

$mainMod = SUPER

# ═══════════════════════════════════════════════════════════
# PODSTAWOWE APLIKACJE
# ═══════════════════════════════════════════════════════════
bind = $mainMod, Return, exec, kitty                         # Terminal
bind = $mainMod, Q, killactive,                              # Zamknij okno
bind = $mainMod, M, exec, logout-with-session                # Wyloguj (zapisuje sesję)
bind = $mainMod, E, exec, dolphin                            # File manager (Dolphin)
bind = $mainMod, F, fullscreen, 0                            # Fullscreen
bind = $mainMod, V, togglefloating,                          # Toggle floating
bind = $mainMod, D, exec, rofi -show drun                    # Application launcher
bind = $mainMod, J, togglesplit,                             # Toggle split
bind = $mainMod, B, exec, chromium                            # Chromium
bind = $mainMod, C, exec, librewolf                           # LibreWolf
bind = $mainMod, S, exec, spotify-launcher                   # Spotify
bind = $mainMod, I, exec, code                               # IDE (Code)
bind = $mainMod, P, exec, elisa                              # Music player (Elisa)
bind = $mainMod, G, exec, lutris                             # Games (Lutris)

# ═══════════════════════════════════════════════════════════
# PORUSZANIE SIĘ MIĘDZY OKNAMI (Meta + Strzałki)
# ═══════════════════════════════════════════════════════════
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ═══════════════════════════════════════════════════════════
# PRZESUWANIE OKIEN (Meta + Shift + Strzałki) - inteligentne
# Przenosi wewnątrz monitora, lub na inny monitor gdy okno jest na krawędzi
# ═══════════════════════════════════════════════════════════
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# ═══════════════════════════════════════════════════════════
# RESIZE OKIEN (Meta + Ctrl + Strzałki)
# ═══════════════════════════════════════════════════════════
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40

# ═══════════════════════════════════════════════════════════
# PRZEŁĄCZANIE WORKSPACE (Meta + 1-9)
# ═══════════════════════════════════════════════════════════
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ═══════════════════════════════════════════════════════════
# PRZENOSZENIE OKIEN NA WORKSPACE (Meta + Shift + 1-9)
# ═══════════════════════════════════════════════════════════
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ═══════════════════════════════════════════════════════════
# MULTI-MONITOR (Meta + Alt + Strzałki lewo/prawo)
# ═══════════════════════════════════════════════════════════
bind = $mainMod ALT, left, focusmonitor, l
bind = $mainMod ALT, right, focusmonitor, r

# Przenoszenie okien między monitorami (Meta + Ctrl + Shift + Strzałki)
#bind = $mainMod SHIFT, left, movewindow, mon:l
#bind = $mainMod SHIFT, right, movewindow, mon:r
#bind = $mainMod SHIFT, M, exec, hyprctl dispatch movewindow mon:l
#bind = $mainMod SHIFT ALT, M, exec, hyprctl dispatch movewindow mon:r

# ═══════════════════════════════════════════════════════════
# SPECIAL WORKSPACE (scratchpad) - WYŁĄCZONE (koliduje ze screenshotem)
# ═══════════════════════════════════════════════════════════
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# ═══════════════════════════════════════════════════════════
# SCROLL PRZEZ WORKSPACES (Meta + Scroll)
# ═══════════════════════════════════════════════════════════
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ═══════════════════════════════════════════════════════════
# MYSZ - PRZESUWANIE I RESIZE (Meta + LMB/RMB)
# ═══════════════════════════════════════════════════════════
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ═══════════════════════════════════════════════════════════
# MULTIMEDIA KEYS
# ═══════════════════════════════════════════════════════════
# Audio
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Media controls
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Brightness (dla laptopów)
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ═══════════════════════════════════════════════════════════
# SCREENSHOTY
# ═══════════════════════════════════════════════════════════
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot copied to clipboard"
bind = SHIFT, Print, exec, grim ~/Pictures/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png && notify-send "Screenshot saved"
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot copied to clipboard"

# ═══════════════════════════════════════════════════════════
# UTILITIES
# ═══════════════════════════════════════════════════════════
bind = $mainMod, L, exec, hyprlock                           # Lock screen
bind = $mainMod SHIFT, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy  # Clipboard history

# ═══════════════════════════════════════════════════════════
# OPACITY RULES - Cyberpunk vaporwave aesthetic
# Nowa składnia Hyprland v0.53+ - używamy 'window' zamiast 'windowrulev2'
# ═══════════════════════════════════════════════════════════
window = opacity:0.80 0.75, class:(code-oss)
window = opacity:0.80 0.75, class:(kitty)
window = opacity:0.90 0.85, class:(firefox)
window = opacity:0.90 0.85, class:(chromium)
window = opacity:0.85 0.80, class:(thunar)
window = opacity:0.85 0.80, class:(dolphin)
window = opacity:0.90 0.85, class:(qt5ct)
window = opacity:0.90 0.85, class:(qt6ct)
window = opacity:0.92 0.88, class:(rofi)
window = opacity:0.90 0.85, class:(org.kde.dolphin)
window = opacity:0.85 0.80, class:(pcmanfm-qt)
window = opacity:0.90 0.85, class:(Joplin)
window = opacity:0.90 0.85, class:(spotify)
window = opacity:0.90 0.85, class:(spotify-launcher)
window = opacity:0.90 0.85, class:(Spotify)
window = opacity:0.90 0.85, class:(calibre-gui)
window = opacity:0.90 0.85, class:(calibre)
window = opacity:0.90 0.85, class:(pavucontrol)
