# █▀█ ░█░ █▀▀ █▀▄ █ █▄▀ █▄▄ ██▄

general {
    lock_cmd = pidof hyprlock || hyprlock       # Unikaj wielokrotnego uruchamiania
    before_sleep_cmd = loginctl lock-session    # Blokuj przed sleep
    after_sleep_cmd = hyprctl dispatch dpms on  # Włącz monitor po obudzeniu
    ignore_dbus_inhibit = false                 # Respektuj inhibitory (np. podczas filmów)
}

# Zgaś ekran po 5 minutach
listener {
    timeout = 300                               # 5 minut
    on-timeout = brightnessctl -s set 10%       # Przyciemnij do 10%
    on-resume = brightnessctl -r                # Przywróć jasność
}

# Zgaś monitor po 10 minutach
listener {
    timeout = 600                               # 10 minut
    on-timeout = hyprctl dispatch dpms off      # Wyłącz monitor
    on-resume = hyprctl dispatch dpms on        # Włącz monitor
}

# Zablokuj ekran po 15 minutach bezczynności
listener {
    timeout = 900                               # 15 minut
    on-timeout = loginctl lock-session          # Blokuj sesję
}

