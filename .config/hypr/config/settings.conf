#  ◈ SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    border_size = 2
    gaps_in = 2
    gaps_out = 3
    float_gaps = 2
    resize_on_border = true
    extend_border_grab_area = 30
    col.active_border = rgba(a855f799) rgba(3b82f699) 45deg
    col.inactive_border = rgba(2d1b4e66)
}

decoration {
    rounding = 0
    active_opacity = 1
    inactive_opacity = 1
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

input {
    numlock_by_default = true  # Numlock włączony przy starcie
    kb_layout = pl

    follow_mouse = 0  # Wyłączone - focus tylko przez kliknięcie
    float_switch_override_focus = 2

    touchpad {
        natural_scroll = false
    }

    sensitivity = -0.2
    accel_profile = flat
}

cursor {
    no_hardware_cursors = false  # false = używaj hardware cursor (mniej obciąża GPU)
    no_break_fs_vrr = true  # WYŁĄCZONE VRR w fullscreen - stabilność
    min_refresh_rate = 60  # Minimalny refresh rate (oszczędza GPU gdy idle)
    hotspot_padding = 0  # Bez paddingu = mniej GPU work
    inactive_timeout = 0  # 0 = cursor zawsze aktywny (bez ukrywania)
    no_warps = false  # false = pozwól na warping (lepsze dla multi-monitor)
    persistent_warps = false  # false = nie zapamiętuj warp positions
    warp_on_change_workspace = false  # false = nie warp przy zmianie workspace
}
misc {
    font_family = JetBrains Mono
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    # Windows pop in instead of sliding
    animation = windows, 1, 5, myBezier, popin 80%
    animation = windowsOut, 1, 5, myBezier, popin 80%
    # Layers (rofi, waybar) set to fade to remove the up/down slide
    animation = layers, 1, 5, myBezier, fade
    animation = layersIn, 1, 5, myBezier, fade
    animation = layersOut, 1, 5, myBezier, fade
    animation = fade, 1, 5, myBezier
    # Workspaces slide horizontally (standard)
    animation = workspaces, 1, 5, myBezier, slide
    # Special workspaces fade to avoid the vertical slide
    animation = specialWorkspaceIn, 1, 5, myBezier, fade
    animation = specialWorkspaceOut, 1, 5, myBezier, fade
}
